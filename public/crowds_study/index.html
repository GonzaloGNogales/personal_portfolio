<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Crowd Motion Study</title>
  <script>
    // Relative asset paths need a trailing slash (…/crowds_study/ not …/crowds_study).
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search);
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Fixed-size canvas, scaled as a whole to fit the window (see fitStage in app.js). -->
  <div id="stage" class="stage">

    <!-- Start: language choice and welcome -->
    <section id="screen-start" class="screen">
      <div class="card start-card">
        <span class="label" data-t="languageLabel">Language</span>
        <div id="language-buttons" class="language-buttons"></div>
        <h1 data-t="startTitle">Welcome</h1>
        <p id="start-subtitle" class="start-subtitle"></p>
        <p class="muted start-help" data-t="startHelp"></p>
        <div class="actions">
          <button id="start-continue" class="btn primary" data-t="continueBtn">Continue</button>
        </div>
      </div>
    </section>

    <!-- Consent 1/3: the full information sheet; continue unlocks at the end of the text -->
    <section id="screen-consent-read" class="screen" hidden>
      <div class="card consent-card">
        <h2 data-t="consentReadTitle">Information sheet</h2>
        <div id="consent-doc" class="consent-doc"></div>
        <p class="muted consent-hint" data-t="consentReadHint"></p>
        <div class="actions">
          <button id="consent-read-back" class="btn" data-t="backBtn">Back</button>
          <button id="consent-read-next" class="btn primary wide-btn" data-t="consentReadNext" disabled>Continue</button>
        </div>
      </div>
    </section>

    <!-- Consent 2/3: the signed form (name, capacity, place, date, signature, acceptance) -->
    <section id="screen-consent-sign" class="screen" hidden>
      <div class="card consent-card sign-card">
        <h2 id="sign-title"></h2>
        <div class="sign-layout">
          <div id="sign-statement" class="sign-statement"></div>
          <div class="sign-form">
            <label class="field">
              <span class="field-label" data-t="fullNameLabel"></span>
              <input id="sign-name" type="text" maxlength="120" autocomplete="name" spellcheck="false">
            </label>
            <div class="field">
              <span class="field-label" data-t="capacityLabel"></span>
              <div class="capacity-row">
                <label class="radio"><input type="radio" name="capacity" value="self"><span id="cap-self"></span></label>
                <label class="radio"><input type="radio" name="capacity" value="behalf"><span id="cap-behalf"></span></label>
              </div>
            </div>
            <label class="field" id="represented-field">
              <span class="field-label" id="represented-label"></span>
              <input id="sign-represented" type="text" maxlength="120" spellcheck="false" disabled>
            </label>
            <div class="field-row">
              <label class="field">
                <span class="field-label" data-t="placeLabel"></span>
                <input id="sign-place" type="text" maxlength="80" autocomplete="address-level2" spellcheck="false">
              </label>
              <div class="field date-field">
                <span class="field-label" data-t="dateLabel"></span>
                <span id="sign-date" class="date-value"></span>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-t="signatureLabel"></span>
              <div class="signature-pad">
                <canvas id="signature-canvas"></canvas>
                <span class="signature-hint" data-t="signatureHint"></span>
                <button id="signature-clear" type="button" class="link-btn" data-t="clearSignature">Clear</button>
              </div>
            </div>
            <p class="minor-note" data-t="minorNote"></p>
          </div>
        </div>
        <label class="accept"><input type="checkbox" id="sign-accept"><span data-t="acceptLabel"></span></label>
        <p id="sign-status" class="status centered"></p>
        <div class="actions">
          <button id="sign-back" class="btn" data-t="backBtn">Back</button>
          <button id="sign-submit" class="btn primary" data-t="signBtn" disabled>Sign</button>
        </div>
      </div>
    </section>

    <!-- Consent 3/3: saved + download a copy -->
    <section id="screen-consent-done" class="screen" hidden>
      <div class="card message-card">
        <h2 data-t="consentDoneTitle">Consent signed</h2>
        <div class="message-text">
          <p id="consent-done-text"></p>
          <p id="consent-code-line" class="code-line"></p>
        </div>
        <p id="consent-save-status" class="status centered"></p>
        <div class="actions">
          <button id="consent-download" class="btn" data-t="downloadConsentBtn">Download</button>
          <button id="consent-done-next" class="btn primary" data-t="continueBtn" disabled>Continue</button>
        </div>
      </div>
    </section>

    <!-- Demographics -->
    <section id="screen-demographics" class="screen" hidden>
      <div class="card demo-card">
        <h2 data-t="demoTitle">About you</h2>
        <p class="muted demo-intro" data-t="demoIntro"></p>
        <div class="demo-q">
          <span class="field-label" data-t="ageLabel"></span>
          <div id="age-options" class="choice-row age-row"></div>
        </div>
        <div class="demo-q">
          <span class="field-label" data-t="genderLabel"></span>
          <div id="gender-options" class="choice-row gender-row"></div>
        </div>
        <div class="demo-q">
          <span class="field-label" data-t="expLabel"></span>
          <div id="exp-options" class="choice-row exp-row"></div>
          <div class="exp-legend"><span data-t="expLow"></span><span data-t="expHigh"></span></div>
        </div>
        <p id="demo-warning" class="status centered demo-warning"></p>
        <div class="actions">
          <button id="demo-back" class="btn" data-t="backBtn">Back</button>
          <button id="demo-resign" class="btn wide-btn" data-t="backToConsent" hidden>Back to consent</button>
          <button id="demo-next" class="btn primary" data-t="continueBtn" disabled>Continue</button>
        </div>
      </div>
    </section>

    <!-- Instructions -->
    <section id="screen-instructions" class="screen" hidden>
      <div class="card instructions-card">
        <div id="instructions-content" class="prose instructions-scroll"></div>
        <div class="actions">
          <button id="instructions-back" class="btn" data-t="backBtn">Back</button>
          <button id="instructions-begin" class="btn primary" data-t="beginBtn">Start</button>
        </div>
        <p id="instructions-status" class="status centered"></p>
      </div>
    </section>

    <!-- Anchoring: the four DEMO clips, watched but not rated -->
    <section id="screen-anchor" class="screen" hidden>
      <div class="anchor-layout">
        <h2 data-t="anchorTitle">Examples</h2>
        <p class="anchor-text" data-t="anchorText"></p>
        <div id="anchor-grid" class="anchor-grid"></div>
        <div class="actions">
          <button id="anchor-continue" class="btn primary" data-t="continueBtn" disabled>Continue</button>
        </div>
      </div>
    </section>

    <!-- Generic message: practice intro and block intros -->
    <section id="screen-message" class="screen" hidden>
      <div class="card message-card">
        <h2 id="message-title"></h2>
        <div id="message-text" class="message-text"></div>
        <div class="actions">
          <button id="message-continue" class="btn primary">Continue</button>
        </div>
      </div>
    </section>

    <!-- Trial: one clip, three statements -->
    <section id="screen-trial" class="screen trial" hidden>
      <header class="trial-header">
        <span id="trial-counter" class="badge"></span>
        <p id="trial-description" class="description"></p>
      </header>

      <div class="video-frame trial-video">
        <video id="trial-video" muted playsinline loop preload="auto"
               disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate nofullscreen"></video>
        <div id="trial-loading" class="video-overlay" hidden></div>
        <button id="trial-play" class="video-overlay play" hidden aria-label="Play">▶</button>
      </div>
      <div class="progress trial-progress"><div id="trial-progress" class="progress-fill"></div></div>

      <div id="rating" class="rating locked" role="group">
        <!-- Phone layout only: the scale end points, instead of the six column labels -->
        <div class="rating-legend"><span id="legend-low"></span><span id="legend-high"></span></div>
        <div id="rating-head" class="rating-row rating-head"></div>
        <div id="rating-body"></div>
      </div>

      <footer class="trial-footer">
        <div class="trial-messages">
          <span id="trial-prompt" class="prompt"></span>
          <span id="trial-status" class="status"></span>
        </div>
        <button id="trial-next" class="btn primary" data-t="nextBtn" disabled>Next</button>
      </footer>
    </section>

    <!-- End -->
    <section id="screen-end" class="screen" hidden>
      <div class="card message-card">
        <h2 data-t="endTitle">Study complete!</h2>
        <p data-t="endText"></p>
        <p id="end-status" class="status centered"></p>
        <div id="end-offline" hidden>
          <p class="muted" data-t="offlineNote"></p>
          <button id="end-download" class="btn" data-t="downloadBtn">Download</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Shown over everything while the window is too small -->
  <div id="size-warning" class="size-warning" hidden>
    <p id="size-warning-text"></p>
  </div>
</body>
</html>
